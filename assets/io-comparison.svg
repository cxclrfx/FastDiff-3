<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="427" viewBox="0 0 1080 427" role="img" aria-labelledby="title desc"><title id="title">Logical I/O comparison</title><desc id="desc">Reference approximately 1322 MiB. Automatic 262 to 374 MiB across the reported cases. This is not a confidence interval or a physical disk traffic measurement.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1080" height="427" fill="#ffffff" rx="0" /><text x="32" y="44" font-size="28" fill="#132a42" font-weight="700" text-anchor="start">Less logical I/O in the recorded comparison cases</text><text x="32" y="76" font-size="17" fill="#53657a" font-weight="400" text-anchor="start">Reported transfer volumes · MiB · lower is better</text><line x1="240.0" y1="114" x2="240.0" y2="300" stroke="#dce5ed"/><text x="240.0" y="327" font-size="15" fill="#53657a" font-weight="400" text-anchor="middle">0</text><line x1="380.0" y1="114" x2="380.0" y2="300" stroke="#dce5ed"/><text x="380.0" y="327" font-size="15" fill="#53657a" font-weight="400" text-anchor="middle">300</text><line x1="520.0" y1="114" x2="520.0" y2="300" stroke="#dce5ed"/><text x="520.0" y="327" font-size="15" fill="#53657a" font-weight="400" text-anchor="middle">600</text><line x1="660.0" y1="114" x2="660.0" y2="300" stroke="#dce5ed"/><text x="660.0" y="327" font-size="15" fill="#53657a" font-weight="400" text-anchor="middle">900</text><line x1="800.0" y1="114" x2="800.0" y2="300" stroke="#dce5ed"/><text x="800.0" y="327" font-size="15" fill="#53657a" font-weight="400" text-anchor="middle">1,200</text><line x1="940.0" y1="114" x2="940.0" y2="300" stroke="#dce5ed"/><text x="940.0" y="327" font-size="15" fill="#53657a" font-weight="400" text-anchor="middle">1,500</text><text x="32" y="166" font-size="22" fill="#132a42" font-weight="700" text-anchor="start">Reference</text><rect x="240" y="138" width="616.9333333333334" height="42" fill="#53657a" rx="4" /><text x="868.9333333333334" y="166" font-size="19" fill="#53657a" font-weight="700" text-anchor="start">≈ 1,322</text><text x="32" y="260" font-size="22" fill="#132a42" font-weight="700" text-anchor="start">Automatic</text><rect x="240" y="232" width="122.26666666666667" height="42" fill="#087f8c" rx="4" /><rect x="362.26666666666665" y="232" width="52.266666666666666" height="42" fill="#a8dbdd" rx="0" stroke="#087f8c" stroke-dasharray="4 3"/><text x="429.5333333333333" y="260" font-size="21" fill="#087f8c" font-weight="700" text-anchor="start">262–374 MiB</text><text x="32" y="372" font-size="16" fill="#53657a" font-weight="400" text-anchor="start">The Automatic interval is the reported range across cases, not a confidence interval.</text><text x="32" y="401" font-size="16" fill="#53657a" font-weight="400" text-anchor="start">Logical transfers include cached I/O; these are not physical disk-traffic measurements.</text></g></svg>
