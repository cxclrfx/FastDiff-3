<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="615" viewBox="0 0 1080 615" role="img" aria-labelledby="title desc"><title id="title">FastDiff 3 capability overview</title><desc id="desc">Twelve documented capabilities, listed as product outcomes without an implementation diagram.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1080" height="615" fill="#ffffff" rx="0" /><text x="32" y="43" font-size="29" fill="#132a42" font-weight="700" text-anchor="start">FastDiff 3 · product capabilities</text><text x="32" y="76" font-size="18" fill="#53657a" font-weight="400" text-anchor="start">Compare data. Control the run. Retain a verifiable result.</text><rect x="32" y="106" width="326" height="92" fill="#f3f7fa" rx="10" /><rect x="32" y="106" width="5" height="92" fill="#087f8c" rx="2" /><text x="51" y="141" font-size="20" fill="#132a42" font-weight="700" text-anchor="start">Bounded RAM</text><text x="51" y="171" font-size="14" fill="#53657a" font-weight="400" text-anchor="start">Explicit memory limits</text><rect x="377" y="106" width="326" height="92" fill="#f3f7fa" rx="10" /><rect x="377" y="106" width="5" height="92" fill="#087f8c" rx="2" /><text x="396" y="141" font-size="20" fill="#132a42" font-weight="700" text-anchor="start">Deterministic results</text><text x="396" y="171" font-size="14" fill="#53657a" font-weight="400" text-anchor="start">Consistent comparison outcomes</text><rect x="722" y="106" width="326" height="92" fill="#f3f7fa" rx="10" /><rect x="722" y="106" width="5" height="92" fill="#087f8c" rx="2" /><text x="741" y="141" font-size="20" fill="#132a42" font-weight="700" text-anchor="start">Local / offline</text><text x="741" y="171" font-size="14" fill="#53657a" font-weight="400" text-anchor="start">Data stays under operator control</text><rect x="32" y="218" width="326" height="92" fill="#f3f7fa" rx="10" /><rect x="32" y="218" width="5" height="92" fill="#087f8c" rx="2" /><text x="51" y="253" font-size="20" fill="#132a42" font-weight="700" text-anchor="start">Checkpoint / Resume</text><text x="51" y="283" font-size="14" fill="#53657a" font-weight="400" text-anchor="start">Continue supported comparisons</text><rect x="377" y="218" width="326" height="92" fill="#f3f7fa" rx="10" /><rect x="377" y="218" width="5" height="92" fill="#087f8c" rx="2" /><text x="396" y="253" font-size="20" fill="#132a42" font-weight="700" text-anchor="start">Distributed Execution</text><text x="396" y="283" font-size="14" fill="#53657a" font-weight="400" text-anchor="start">Supported local execution</text><rect x="722" y="218" width="326" height="92" fill="#f3f7fa" rx="10" /><rect x="722" y="218" width="5" height="92" fill="#087f8c" rx="2" /><text x="741" y="253" font-size="20" fill="#132a42" font-weight="700" text-anchor="start">Distributed + Resume</text><text x="741" y="283" font-size="14" fill="#53657a" font-weight="400" text-anchor="start">Qualified FULL continuation</text><rect x="32" y="330" width="326" height="92" fill="#f3f7fa" rx="10" /><rect x="32" y="330" width="5" height="92" fill="#087f8c" rx="2" /><text x="51" y="365" font-size="20" fill="#132a42" font-weight="700" text-anchor="start">SQLite</text><text x="51" y="395" font-size="14" fill="#53657a" font-weight="400" text-anchor="start">Read-only data comparison</text><rect x="377" y="330" width="326" height="92" fill="#f3f7fa" rx="10" /><rect x="377" y="330" width="5" height="92" fill="#087f8c" rx="2" /><text x="396" y="365" font-size="20" fill="#132a42" font-weight="700" text-anchor="start">Fixed-point Finance</text><text x="396" y="395" font-size="14" fill="#53657a" font-weight="400" text-anchor="start">Exact amounts at selected precision</text><rect x="722" y="330" width="326" height="92" fill="#f3f7fa" rx="10" /><rect x="722" y="330" width="5" height="92" fill="#087f8c" rx="2" /><text x="741" y="365" font-size="20" fill="#132a42" font-weight="700" text-anchor="start">Evidence / Replay</text><text x="741" y="395" font-size="14" fill="#53657a" font-weight="400" text-anchor="start">Retain and verify the result</text><rect x="32" y="442" width="326" height="92" fill="#f3f7fa" rx="10" /><rect x="32" y="442" width="5" height="92" fill="#087f8c" rx="2" /><text x="51" y="477" font-size="20" fill="#132a42" font-weight="700" text-anchor="start">Fail-close</text><text x="51" y="507" font-size="14" fill="#53657a" font-weight="400" text-anchor="start">Reject invalid or incompatible work</text><rect x="377" y="442" width="326" height="92" fill="#f3f7fa" rx="10" /><rect x="377" y="442" width="5" height="92" fill="#087f8c" rx="2" /><text x="396" y="477" font-size="20" fill="#132a42" font-weight="700" text-anchor="start">Reference / Automatic</text><text x="396" y="507" font-size="14" fill="#53657a" font-weight="400" text-anchor="start">Selectable execution profiles</text><rect x="722" y="442" width="326" height="92" fill="#f3f7fa" rx="10" /><rect x="722" y="442" width="5" height="92" fill="#087f8c" rx="2" /><text x="741" y="477" font-size="20" fill="#132a42" font-weight="700" text-anchor="start">Adaptive Planner</text><text x="741" y="507" font-size="14" fill="#53657a" font-weight="400" text-anchor="start">Optional, qualified product setting</text><text x="32" y="588" font-size="16" fill="#53657a" font-weight="400" text-anchor="start">Supported scope and qualification results: QUALIFICATION.md</text></g></svg>
